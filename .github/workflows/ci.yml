name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: format + analyze + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 版本必须与 docs/ENVIRONMENT_SETUP.md 记录的一致：
      # Flutter 3.47.8 · Dart 3.13.7（本机验证过的版本）。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: 打印工具链版本
        run: flutter --version

      - name: 拉取 workspace 依赖
        run: dart pub get

      - name: 格式检查
        run: >-
          dart format --output=none --set-exit-if-changed
          app/mobile/lib app/mobile/test packages tool

      - name: 纯 Dart 包静态分析
        run: dart analyze packages/osn_protocol packages/osn_identity

      - name: Flutter 应用静态分析
        run: flutter analyze app/mobile

      - name: 协议测试
        run: dart test packages/osn_protocol --reporter expanded

      - name: 身份测试
        run: dart test packages/osn_identity --reporter expanded

      - name: Flutter 测试
        run: flutter test app/mobile --reporter expanded
